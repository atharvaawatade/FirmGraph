[project]
name = "firmgraph"
version = "0.1.0.dev0"
description = "The open evidence layer for firmware: scan -> SBOM -> CVEs -> ranked, reproducible, CRA-mapped evidence."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pyelftools>=0.31",
]

[project.optional-dependencies]
ai = ["litellm>=1.40"]

[project.scripts]
firmgraph = "firmgraph.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["firmgraph"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
