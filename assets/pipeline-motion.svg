<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 248" role="img" aria-labelledby="title desc">
  <title id="title">FirmGraph animated analysis pipeline</title>
  <desc id="desc">Firmware moves through extraction, software inventory, vulnerability analysis, prioritization, and evidence export.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#0b2033"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="248" rx="18" fill="url(#bg)"/>
  <g fill="none" stroke="#16435d" stroke-width="1" opacity=".7">
    <path d="M0 42H1200M0 83H1200M0 124H1200M0 165H1200M0 206H1200"/>
    <path d="M75 0V248M225 0V248M375 0V248M525 0V248M675 0V248M825 0V248M975 0V248M1125 0V248"/>
  </g>
  <path d="M125 125H1075" stroke="#16374f" stroke-width="7" stroke-linecap="round"/>
  <path d="M125 125H1075" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="18 22" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-160" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <g transform="translate(125 125)">
      <circle r="37" fill="#0b2b45" stroke="#38bdf8" stroke-width="2"/>
      <path d="M-13-10h26v20h-26zM-7-16h14M-8 16h16" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
      <text y="66" fill="#d9f2ff" font-size="15" font-weight="700">FIRMWARE</text>
      <text y="87" fill="#83a7ba" font-size="12">fingerprint</text>
    </g>
    <g transform="translate(355 125)">
      <circle r="37" fill="#0b3545" stroke="#2dd4bf" stroke-width="2"/>
      <path d="M-14-13h28v26h-28zM-7-6h14M-7 1h14M-7 8h9" stroke="#99f6e4" stroke-width="3" stroke-linecap="round"/>
      <text y="66" fill="#d9f2ff" font-size="15" font-weight="700">INVENTORY</text>
      <text y="87" fill="#83a7ba" font-size="12">extract + SBOM</text>
    </g>
    <g transform="translate(600 125)">
      <circle r="42" fill="#123344" stroke="#5eead4" stroke-width="2" filter="url(#glow)">
        <animate attributeName="r" values="37;43;37" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <path d="M0-20 17-12v15c0 12-8 20-17 24C-9 23-17 15-17 3v-15z" fill="none" stroke="#a7f3d0" stroke-width="3"/>
      <path d="m-8 1 6 6 11-13" fill="none" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="71" fill="#ecfdf5" font-size="15" font-weight="700">ANALYZE</text>
      <text y="92" fill="#83a7ba" font-size="12">CVEs + exposure</text>
    </g>
    <g transform="translate(845 125)">
      <circle r="37" fill="#17354a" stroke="#60a5fa" stroke-width="2"/>
      <path d="M-15 13V-3M-5 13V-15M5 13V-8M15 13V-20" stroke="#93c5fd" stroke-width="5" stroke-linecap="round"/>
      <text y="66" fill="#d9f2ff" font-size="15" font-weight="700">PRIORITIZE</text>
      <text y="87" fill="#83a7ba" font-size="12">evidence-led ranking</text>
    </g>
    <g transform="translate(1075 125)">
      <circle r="37" fill="#1c3c38" stroke="#86efac" stroke-width="2"/>
      <path d="M-14-17h18l10 10v24h-28zM4-17v10h10M-8 3h16M-8 10h12" stroke="#bbf7d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="66" fill="#ecfdf5" font-size="15" font-weight="700">EVIDENCE</text>
      <text y="87" fill="#83a7ba" font-size="12">report + VEX + CRA</text>
    </g>
  </g>
</svg>
